<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist — VYBE</title>
    <link rel="icon" href="../assets/logo/favicon.png">

    <!-- Polices de la maquette : Manrope (titres) et DM Sans (textes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="editeur-playlist">

    <div class="application">

        <!-- Barre latérale, barre du haut : remplies par js/script.js -->
        <aside class="barre-laterale" id="barreLaterale"></aside>
        <header class="barre-haut" id="barreHaut"></header>

        <main class="contenu">

            <!-- ===== Contenu propre à cette page ===== -->

            <div class="page page-editeur">
                <a href="playlists.html" class="lien-retour"><svg class="icone icone-petite"><use href="../assets/icones.svg#fleche-gauche"></use></svg> Retour aux playlists</a>

                <div class="entete-page">
                    <div>
                        <span class="surtitre">Votre musique, à votre façon</span>
                        <h1 id="titreEditeur">Créer une playlist</h1>
                        <p>Donnez un peu de personnalité à votre collection.</p>
                    </div>
                </div>

                <div class="grille-editeur">

                    <!-- Choix de la pochette -->
                    <div>
                        <div class="apercu-pochette">
                            <img id="apercuPochette" src="../assets/images/blue.jpg" alt="Pochette choisie">
                        </div>
                        <div class="choix-pochettes" id="choixPochettes">
                            <button data-image="../assets/images/blue.jpg" aria-label="Pochette bleue"><img src="../assets/images/blue.jpg" alt=""></button>
                            <button data-image="../assets/images/luna.jpg" aria-label="Pochette portrait"><img src="../assets/images/luna.jpg" alt=""></button>
                            <button data-image="../assets/images/purple.jpg" aria-label="Pochette pourpre"><img src="../assets/images/purple.jpg" alt=""></button>
                            <button data-image="../assets/images/violet.jpg" aria-label="Pochette violette"><img src="../assets/images/violet.jpg" alt=""></button>
                        </div>
                    </div>

                    <!-- Champs du formulaire -->
                    <div class="champs-editeur">
                        <label>
                            Titre de la playlist
                            <input type="text" id="champTitre" maxlength="80" placeholder="Donnez un nom à votre playlist">
                        </label>
                        <p class="message-statut cache" id="erreurTitre">Donnez d'abord un nom à votre playlist.</p>

                        <label>
                            Description
                            <textarea id="champDescription" maxlength="300" placeholder="Quelle est l'histoire de cette playlist ?"></textarea>
                        </label>

                        <div class="visibilite">
                            <div>
                                <b>Playlist publique</b>
                                <span id="texteVisibilite">Vous seul pouvez voir cette playlist</span>
                            </div>
                            <button class="interrupteur" id="interrupteurPublique" aria-label="Playlist publique"><i></i></button>
                        </div>

                        <div class="actions-formulaire">
                            <button class="bouton-supprimer cache" id="boutonSupprimer">Supprimer la playlist</button>
                            <a href="playlists.html" class="bouton bouton-secondaire">Annuler</a>
                            <button class="bouton bouton-principal" id="boutonEnregistrer">Créer la playlist</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pied de page : rempli par js/script.js -->
            <footer class="pied-de-page" id="piedDePage"></footer>
        </main>

        <!-- Lecteur audio et navigation mobile : remplis par js/script.js -->
        <footer class="lecteur" id="lecteur"></footer>
        <nav class="nav-mobile" id="navMobile" aria-label="Navigation principale"></nav>
    </div>

    <!-- Lecteur plein écran : rempli par js/script.js -->
    <div class="lecteur-plein" id="lecteurPlein"></div>

    <!-- script.js (commun) doit être chargé AVANT le script de la page -->
    <script src="../js/script.js"></script>
    <script src="../js/editeur-playlist.js"></script>
</body>
</html>
