<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artiste — VYBE</title>
    <link rel="icon" href="../assets/logo/favicon.png">

    <!-- Polices de la maquette : Manrope (titres) et DM Sans (textes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="artiste">

    <div class="application">

        <!-- Barre latérale, barre du haut : remplies par js/script.js -->
        <aside class="barre-laterale" id="barreLaterale"></aside>
        <header class="barre-haut" id="barreHaut"></header>

        <main class="contenu">

            <!-- ===== Contenu propre à cette page ===== -->

            <div class="page page-detail">

                <!-- Grande image de l'artiste (l'image est choisie en JavaScript) -->
                <section class="hero-artiste" id="heroArtiste">
                    <div>
                        <span class="verifie"><svg class="icone"><use href="../assets/icones.svg#valide"></use></svg> ARTISTE VÉRIFIÉ</span>
                        <h1 id="nomArtiste"></h1>
                        <p id="auditeursArtiste"></p>
                        <div class="actions-hero">
                            <button class="bouton bouton-principal" id="boutonLireArtiste">
                                <svg class="icone icone-pleine"><use href="../assets/icones.svg#lecture"></use></svg> Lire
                            </button>
                            <button class="bouton bouton-secondaire" id="boutonSuivre">Suivre</button>
                        </div>
                    </div>
                </section>

                <section>
                    <div class="titre-section"><h2>Populaires</h2></div>
                    <div id="titresArtiste"></div>
                </section>

                <section>
                    <div class="titre-section"><h2>Discographie</h2></div>
                    <div class="onglets" id="ongletsDiscographie">
                        <button class="actif" data-type="tout">Sorties populaires</button>
                        <button data-type="albums">Albums</button>
                        <button data-type="singles">Singles et EP</button>
                    </div>
                    <div class="grille-cartes six" id="discographie"></div>
                </section>

                <section class="a-propos-artiste">
                    <img id="imageAPropos" src="" alt="">
                    <div>
                        <span class="surtitre">À propos</span>
                        <h2 id="accrocheArtiste"></h2>
                        <p id="bioArtiste"></p>
                        <b><span id="nombreAuditeurs"></span> <small>auditeurs mensuels</small></b>
                    </div>
                </section>
            </div>

            <!-- Pied de page : rempli par js/script.js -->
            <footer class="pied-de-page" id="piedDePage"></footer>
        </main>

        <!-- Lecteur audio et navigation mobile : remplis par js/script.js -->
        <footer class="lecteur" id="lecteur"></footer>
        <nav class="nav-mobile" id="navMobile" aria-label="Navigation principale"></nav>
    </div>

    <!-- Lecteur plein écran : rempli par js/script.js -->
    <div class="lecteur-plein" id="lecteurPlein"></div>

    <!-- script.js (commun) doit être chargé AVANT le script de la page -->
    <script src="../js/script.js"></script>
    <script src="../js/artiste.js"></script>
</body>
</html>
